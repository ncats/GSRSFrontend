<div mat-dialog-content>
  {{data.message}}
</div>
<div mat-dialog-actions>
  @if (((data.type !== null) && (data.type === 'home'))) {
    <div>
      <button mat-button mat-dialog-close>Home</button>
    </div>
  } @else {
    <button class="borderlightgray" mat-button mat-dialog-close>No</button>
    <button class="borderlightgray" mat-button [mat-dialog-close]="true" cdkFocusInitial>Yes</button>
  }
</div>
