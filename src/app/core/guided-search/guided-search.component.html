<div class="content-container">
  <mat-card>
    <mat-card-title>
      Guided Search
    </mat-card-title>
    <mat-card-content>
      <h2>
        Builder
      </h2>
      <div class="builder-container">
        <div class="header-row">
          <div class="condition-column"></div>
          <div class="queryable-property-column">
            Search In Fields
          </div>
          <div class="command-column">
            For
          </div>
          <div class="query-column">
            Query
          </div>
        </div>
        @for (queryStatement of queryStatements; track queryStatement; let index = $index; let isFirst = $first; let isLast = $last) {
          <div class="builder-row">
            <div class="query-statement-container">
              <app-query-statement
                [queryStatementHash]="queryStatement.queryHash"
                [index]="index"
                [queryableDictionary]="queryableSubstanceDict"
                [queryableOptions]="displayProperties"
                [queryableOptionsCommon]="displayPropertiesCommon"
                (queryUpdated)="queryUpdated($event, index)">
              </app-query-statement>
            </div>
            <div class="actions-container">
              <div class="button-container">
                @if (!isFirst || queryStatements.length > 1) {
                  <button mat-icon-button aria-label="remove query statement" (click)="removeQueryStatement(index)">
                    <mat-icon svgIcon="remove_circle_outline"></mat-icon>
                  </button>
                }
              </div>
              <div class="button-container">
                @if (isLast) {
                  <button mat-icon-button aria-label="add query statement" (click)="addQueryStatement()">
                    <mat-icon svgIcon="add_circle_outline"></mat-icon>
                  </button>
                }
              </div>
            </div>
          </div>
        }
      </div>
      <div class="query-builder-actions">
        <button mat-flat-button color="primary" (click)="processSearch()" [disabled]="!query">Search</button>
      </div>
      <h2>
        Query
      </h2>
      <div class="query-container">
        <div class="query-value">
          {{query}}
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
