<div class="flex-row">
  @if (properties && properties.length > pageSize) {
    <mat-form-field [floatLabel]="'never'" class="search">
      <input matInput placeholder="Search" [formControl]="searchControl">
    </mat-form-field>
  }
  <span class="middle-fill"></span>
  <!-- <button mat-button (click)="addProperty()">
  Add property <mat-icon svgIcon="add_circle_outline"></mat-icon>
</button> -->
</div>
@if (properties && properties.length > 5) {
  <mat-paginator [length]="filtered && filtered.length || 0" [pageIndex]="page" [pageSize]="5" showFirstLastButtons="true"
    (page)="pageChange($event, analyticsEventCategory)" [pageSizeOptions]="[5, 10, 25, 100]">
  </mat-paginator>
}
@for (property of paged; track property; let isLast = $last; let index = $index) {
  <div class="property" appScrollToTarget
    [id]="'substance-property-' + index">
    <app-property-form [property]="property" (propertyDeleted)="deleteProperty($event)"></app-property-form>
    @if (!isLast) {
      <mat-divider class="form-divider" [inset]="true"></mat-divider>
    }
  </div>
}
@if (properties && properties.length > 5) {
  <mat-paginator [length]="filtered && filtered.length || 0" [pageIndex]="page" [pageSize]="5" showFirstLastButtons="true"
    (page)="pageChange($event, analyticsEventCategory)" [pageSizeOptions]="[5, 10, 25, 100]">
  </mat-paginator>
}


@if (properties && properties.length > 0) {
  <div style = "display: flex;">
    <span class="middle-fill"></span>
    <button mat-button (click)="addProperty()">
      Add property <mat-icon svgIcon="add_circle_outline"></mat-icon>
    </button>
  </div>
}
