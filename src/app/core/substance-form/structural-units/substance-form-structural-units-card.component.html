<div class="responsive">
  @for (unit of structuralUnits; track unit; let isLast = $last; let index = $index) {
    <div class = "alternate-backgrounds"   appScrollToTarget [id]="'substance-structural-unit-' + index" >
      <app-structural-unit-form [unit]="unit" (unitDeleted)="deleteSRU($event)" ></app-structural-unit-form>
      @if (!isLast) {
        <mat-divider class="form-divider" [inset]="true"></mat-divider>
      }
    </div>
  }
</div>
