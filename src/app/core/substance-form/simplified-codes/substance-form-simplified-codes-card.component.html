<div class="flex-row">
  @if (codes && codes.length > pageSize) {
    <mat-form-field [floatLabel]="'never'" class="search">
      <input matInput placeholder="Search" [formControl]="searchControl">
    </mat-form-field>
  }
  <span class="middle-fill"></span>
</div>

@if (codes && codes.length > 5) {
  <mat-paginator [length]="filtered && filtered.length || 0" [pageIndex]="page" [pageSize]="10" showFirstLastButtons="true"
    (page)="pageChange($event, analyticsEventCategory)" [pageSizeOptions]="[5, 10, 25, 100]">
  </mat-paginator>
}
@for (code of paged; track code; let isLast = $last; let index = $index) {
  <div class="code" appScrollToTarget
    [id]="'substance-code-' + index">
    <app-simplified-code-form [code]="code" (codeDeleted)="deleteCode($event)" [show] = "expanded"></app-simplified-code-form>
    @if (!isLast) {
      <mat-divider class="form-divider" [inset]="true"></mat-divider>
    }
  </div>
}
@if (codes && codes.length > 5) {
  <mat-paginator [length]="filtered && filtered.length || 0" [pageIndex]="page" [pageSize]="10" showFirstLastButtons="true"
    (page)="pageChange($event, analyticsEventCategory)" [pageSizeOptions]="[5, 10, 25, 100]">
  </mat-paginator>
}
