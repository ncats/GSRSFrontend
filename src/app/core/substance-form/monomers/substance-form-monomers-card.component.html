<div class="flex-row">
  <span class="middle-fill"></span>
  <!-- <button mat-button (click)="addCode()">
  Add Monomer <mat-icon svgIcon="add_circle_outline"></mat-icon>
</button> -->
</div>
@for (monomer of monomers; track monomer; let isLast = $last; let index = $index) {
  <div class="monomer" appScrollToTarget
    [id]="'substance-monomer-' + index">
    <app-monomer-form [monomer]="monomer" (monomerDeleted)="deleteCode($event)"></app-monomer-form>
    @if (!isLast) {
      <mat-divider class="form-divider" [inset]="true"></mat-divider>
    }
  </div>
}

<div class="flex-row">
  <span class = "middle-fill"></span>
  <button mat-button (click)="addMonomer()">
    Add Monomer <mat-icon svgIcon="add_circle_outline"></mat-icon>
  </button>
</div>
