<div class="flex-row">
  <span class="middle-fill"></span>
  <!-- <button mat-button (click)="addConstituent()">
    Add Constituent <mat-icon svgIcon="add_circle_outline"></mat-icon>
  </button> -->
</div>
<mat-checkbox [checked] = "formulation" (change) = "toggleFormulation($event)"
 matTooltip = "Automatically fills in values for formulations where the amounts should be percentages totalling 100%">Formulation Autofill</mat-checkbox>
  <div class = "alternate-backgrounds" *ngFor = "let constituent of constituents; last as isLast; index as index"  appScrollToTarget [id]="'substance-constituent-' + index" >
    <app-constituent-form [constituent]="constituent" (constituentDeleted)="deleteConstituent($event)" [formulation] = "formulation" (amountUpdated) = "calcFormulation($event)"></app-constituent-form>
    <mat-divider class="form-divider" [inset]="true" *ngIf="!isLast"></mat-divider>
  </div>


  <div class="flex-row">
      <span class = "middle-fill"></span>
         <button mat-button (click)="addConstituent(formulation)">
          Add Constituent <mat-icon svgIcon="add_circle_outline"></mat-icon>
        </button>
</div>
