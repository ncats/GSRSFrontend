<div class="parameter-form-container">
  <div class="form-row">
    <mat-form-field class="name">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="parameter.name" required name="name" />
    </mat-form-field>
    <mat-form-field class="type">
      <mat-label>Type</mat-label>
      <mat-select [(ngModel)]="parameter.type" name="type">
        @for (propertyType of propertyTypeList; track propertyType) {
          <mat-option
            [value]="propertyType.value"
            >
            {{ propertyType.display }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  <div class="amount-form-container">
    <div class="amount-title">Amount</div>
    <app-amount-form [substanceAmount]="parameter.value"></app-amount-form>
  </div>
</div>
