<div class="flex-row">
  @if (references && references.length > pageSize) {
    <mat-form-field [floatLabel]="'never'" class="search">
      <input matInput placeholder="Search" [formControl]="searchControl">
    </mat-form-field>
  }
  <span class="middle-fill"></span>
  <!-- <button mat-button (click)="addSubstanceReference()">
  Add reference <mat-icon svgIcon="add_circle_outline"></mat-icon>
</button> -->
</div>
@if (references && references.length > 5) {
  <mat-paginator [length]="filtered && filtered.length || 0" [pageIndex]="page" [pageSize]="pageSize" showFirstLastButtons="true" (page)="pageChange($event, analyticsEventCategory)"
    [pageSizeOptions]="pageSizeOptions">
  </mat-paginator>
}
@for (reference of paged; track reference; let isLast = $last) {
  <div class="reference" [id]="reference.uuid" appScrollToTarget>
    <app-reference-form [reference]="reference" (referenceDeleted)="deleteReference($event)"></app-reference-form>
    @if (!isLast) {
      <mat-divider class="form-divider" [inset]="true"></mat-divider>
    }
  </div>
}
@if (references && references.length > 5) {
  <mat-paginator [length]="filtered && filtered.length || 0" [pageIndex]="page" [pageSize]="pageSize" showFirstLastButtons="true" (page)="pageChange($event, analyticsEventCategory)"
    [pageSizeOptions]="pageSizeOptions">
  </mat-paginator>
}

@if (references && references.length > 0) {
  <div style = "display: flex;">
    <span class="middle-fill"></span>
    <button mat-button (click)="addSubstanceReference()">
      Add reference <mat-icon svgIcon="add_circle_outline"></mat-icon>
    </button>
  </div>
}
