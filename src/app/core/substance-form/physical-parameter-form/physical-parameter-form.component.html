<div class="parameter-form-container">
  <div class="form-row" class="name-row">
    <mat-form-field class="name">
      <mat-label>Name</mat-label>
      <input
        matInput
        [(ngModel)]="parameter.parameterName"
        required
        name="name"
      />
    </mat-form-field>
  </div>
  <div class="amount-form-container">
    <div class="amount-title">Amount</div>
    <app-amount-form [substanceAmount]="parameter.amount"></app-amount-form>
  </div>
</div>
