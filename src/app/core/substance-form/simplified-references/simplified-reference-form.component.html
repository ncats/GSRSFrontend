<div class="reference-form-container">
  @if (reference.$$deletedCode) {
    <div class="notification-backdrop">
      Deleted&nbsp;
      <button mat-icon-button matTooltip="Undo" (click)="undoDelete()">
        <mat-icon svgIcon="undo"></mat-icon>
      </button>
    </div>
  }

  <div class="form-row">
    @if (reference.uuid) {
      <div class="delete-container">
        <button
          mat-icon-button
          matTooltip="Delete reference"
          (click)="deleteReference()"
          >
          <mat-icon svgIcon="delete_forever"></mat-icon>
        </button>
      </div>
    }

    <app-cv-input
      required="true"
      class="source-type"
      domain="DOCUMENT_TYPE"
      title="Source Type"
      [model]="reference.docType"
      (valueChange)="setSourceType($event)"
      >
    </app-cv-input>

    <mat-form-field class="citation">
      <mat-label>Source Text/Citation</mat-label>
      <input
        matInput
        [(ngModel)]="reference.citation"
        required
        name="citation"
        />
    </mat-form-field>

    <div>
      <app-access-manager
        (accessOut)="updateAccess($event)"
        [access]="reference.access"
        >
      </app-access-manager>
    </div>
  </div>
</div>
