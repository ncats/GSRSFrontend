<div class="access">
  <app-access-manager
    class="right"
    (accessOut)="updateAccess($event)"
    [access]="substanceAmount.access"
  >
  </app-access-manager>
</div>
<form class="amount-form" *ngIf="substanceAmount">
  <div class="form-row">
    <div class="other-container">
      <div>
        <mat-form-field class="amount-type">
          <mat-label>Type *</mat-label>
          <mat-select [formControl]="typeControl">
            <mat-option [value]="null"
              ><span class="deselect">Clear selection</span></mat-option
            >
            <mat-option
              *ngFor="let type of amountTypeList"
              [value]="type.value"
            >
              {{ type.display }}
            </mat-option>
            <mat-option
              *ngIf="
                privateSubstanceAmount.type &&
                !inCV(amountTypeList, privateSubstanceAmount.type) &&
                privateSubstanceAmount.type !== ''
              "
              value="{{ privateSubstanceAmount.type }}"
              >{{ privateSubstanceAmount.type }} (not in CV)</mat-option
            >
            <mat-option value="other">Other (New Value)</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div *ngIf="privateSubstanceAmount.type === 'other'" class="custom">
        <mat-form-field>
          <input
            matInput
            placeholder="Custom value"
            (focusout)="updateType($event.target)"
            name="custom"
          />
        </mat-form-field>
      </div>
    </div>
    <mat-form-field class="amount-average">
      <mat-label>Average</mat-label>
      <input type="text" matInput [formControl]="averageControl" />
    </mat-form-field>
    <mat-form-field class="low">
      <mat-label>Low</mat-label>
      <input type="text" matInput [formControl]="lowControl" />
    </mat-form-field>
    <mat-form-field class="high">
      <mat-label>High</mat-label>
      <input type="text" matInput [formControl]="highControl" />
    </mat-form-field>
  </div>
  <div class="form-row">
    <mat-form-field class="low-limit">
      <mat-label>Low Limit</mat-label>
      <input type="text" matInput [formControl]="lowLimitControl" />
    </mat-form-field>
    <mat-form-field class="high-limit">
      <mat-label>High Limit</mat-label>
      <input type="text" matInput [formControl]="highLimitControl" />
    </mat-form-field>
    <div class="other-container">
      <div>
        <mat-form-field class="amount-units">
          <mat-label>Units</mat-label>
          <mat-select [formControl]="unitsControl">
            <mat-option [value]="null"
              ><span class="deselect">Clear selection</span></mat-option
            >
            <mat-option
              *ngFor="let unit of amountUnitList"
              [value]="unit.value"
            >
              {{ unit.display }}
            </mat-option>
            <mat-option
              *ngIf="
                privateSubstanceAmount.units &&
                !inCV(amountUnitList, privateSubstanceAmount.units) &&
                privateSubstanceAmount.units !== ''
              "
              value="{{ privateSubstanceAmount.units }}"
              >{{ privateSubstanceAmount.units }} (not in CV)</mat-option
            >
            <mat-option value="other">Other (New Value)</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div *ngIf="privateSubstanceAmount.units === 'other'" class="custom">
        <mat-form-field>
          <mat-label>Custom Value</mat-label>
          <input
            matInput
            (focusout)="updateUnits($event.target)"
            name="custom"
          />
        </mat-form-field>
      </div>
    </div>
    <mat-form-field class="non-numeric-value">
      <mat-label>Non-numeric Value</mat-label>
      <input matInput [formControl]="nonNumericValueControl" />
    </mat-form-field>
  </div>
</form>
