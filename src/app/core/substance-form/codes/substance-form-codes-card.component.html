<div class="flex-row">
  @if (codes && codes.length > pageSize) {
    <mat-form-field
      [floatLabel]="'never'"
      class="search"
      >
      <input matInput placeholder="Search" [formControl]="searchControl" />
    </mat-form-field>
  }
  <span class="middle-fill"></span>
  @if (codes && codes.length > 0) {
    <button
      class="standardize"
      matButton
      matTooltip="expand / collapse code view rows"
      (click)="collapse()"
      >
      {{ expanded ? "Collapse" : "Expand" }} All
    </button>
  }
  <!-- <button mat-button (click)="addCode()" [disabled] = "isAlternative">
  Add code <mat-icon svgIcon="add_circle_outline"></mat-icon>
</button> -->
</div>
@if (codes && codes.length > 5) {
  <mat-paginator
    [length]="(filtered && filtered.length) || 0"
    [pageIndex]="page"
    [pageSize]="pageSize"
    showFirstLastButtons="true"
    (page)="pageChange($event, analyticsEventCategory)"
    [pageSizeOptions]="pageSizeOptions"
    >
  </mat-paginator>
}
@for (code of paged; track code; let isLast = $last; let index = $index) {
  <div
    class="code"
    appScrollToTarget
    [id]="'substance-code-' + index"
    >
    <app-code-form
      [code]="code"
      (codeDeleted)="deleteCode($event)"
      [show]="expanded"
    ></app-code-form>
    @if (!isLast) {
      <mat-divider
        class="form-divider"
        [inset]="true"
      ></mat-divider>
    }
  </div>
}
@if (codes && codes.length > 5) {
  <mat-paginator
    [length]="(filtered && filtered.length) || 0"
    [pageIndex]="page"
    [pageSize]="pageSize"
    showFirstLastButtons="true"
    (page)="pageChange($event, analyticsEventCategory)"
    [pageSizeOptions]="pageSizeOptions"
    >
  </mat-paginator>
}

@if (codes && codes.length > 0) {
  <div style="display: flex">
    <span class="middle-fill"></span>
    <button matButton (click)="addCode()" [disabled]="isAlternative">
      Add code <mat-icon svgIcon="add_circle_outline"></mat-icon>
    </button>
  </div>
}
