<div class="flex-row">
  @if (notes && notes.length > pageSize) {
    <mat-form-field [floatLabel]="'never'" class="search">
      <input matInput placeholder="Search" [formControl]="searchControl">
    </mat-form-field>
  }
  <span class="middle-fill"></span>
  <!-- <button mat-button (click)="addNote()">
  Add note <mat-icon svgIcon="add_circle_outline"></mat-icon>
</button> -->
</div>
@if (notes && notes.length > 5) {
  <mat-paginator [length]="filtered && filtered.length || 0" [pageIndex]="page" [pageSize]="5" showFirstLastButtons="true"
    (page)="pageChange($event, analyticsEventCategory)" [pageSizeOptions]="[5, 10, 25, 100]">
  </mat-paginator>
}
@for (note of paged; track note; let isLast = $last; let index = $index) {
  <div class="note" appScrollToTarget
    [id]="'substance-note-' + index">
    <app-note-form [note]="note" (noteDeleted)="deleteNote($event)"></app-note-form>
    @if (!isLast) {
      <mat-divider class="form-divider" [inset]="true"></mat-divider>
    }
  </div>
}
@if (notes && notes.length > 5) {
  <mat-paginator [length]="filtered && filtered.length || 0" [pageIndex]="page" [pageSize]="5" showFirstLastButtons="true"
    (page)="pageChange($event, analyticsEventCategory)" [pageSizeOptions]="[5, 10, 25, 100]">
  </mat-paginator>
}


@if (notes && notes.length > 0) {
  <div style = "display: flex;">
    <span class="middle-fill"></span>
    <button mat-button (click)="addNote()">
      Add note <mat-icon svgIcon="add_circle_outline"></mat-icon>
    </button>
  </div>
}
