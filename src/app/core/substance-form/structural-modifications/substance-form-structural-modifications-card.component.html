<div class="flex-row">
  <span class="middle-fill"></span>
  <!-- <button mat-button (click)="addStructuralModification()">
  Add Modification <mat-icon svgIcon="add_circle_outline"></mat-icon>

</div>
@for (mod of modifications; track mod; let isLast = $last; let index = $index) {
  <div class = "alternate-backgrounds"   appScrollToTarget [id]="'substance-structural-modification-' + index" >
    <app-structural-modification-form [mod]="mod" (modDeleted)="deleteStructuralModification($event)"></app-structural-modification-form>
    @if (!isLast) {
      <mat-divider class="form-divider" [inset]="true"></mat-divider>
    }
  </div>
}


<div class="flex-row">
  <span class="middle-fill"></span>
  <button mat-button (click)="addStructuralModification()">
    Add Modification <mat-icon svgIcon="add_circle_outline"></mat-icon>
  </button>

</div>
