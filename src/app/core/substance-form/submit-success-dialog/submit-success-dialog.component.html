<h1 mat-dialog-title>
  {{dialogTitle}}
</h1>
<div mat-dialog-content class = "submit-message">
  {{dialogMessage}}
</div>
@if (!fileUrl) {
  <div class="flex-row dialog-actions" mat-dialog-actions>
    <button mat-flat-button color="primary" (click)="dismissDialog('continue')">Continue Editing</button>
    <!-- Do not show the following buttons, if the Dialog is launching from SSG4 page -->
    @if (isCoreSubstance === 'true' && !staging) {
      <button mat-flat-button color="primary" (click)="dismissDialog('browse')">Go to
      Browse</button>
    }
    @if (isCoreSubstance === 'true' && !staging) {
      <button mat-flat-button color="primary" (click)="dismissDialog('view')">View
      Substance</button>
    }
    @if (staging) {
      <button mat-flat-button color="primary" (click)="dismissDialog('staging')">Return to Staging Area</button>
    }
  </div>
}
@if (fileUrl) {
  <div class="flex-row dialog-actions" mat-dialog-actions>
    <span class="middle-fill"></span>
    <!-- Do not show the following buttons, if the Dialog is launching from SSG4 page -->
    @if (isCoreSubstance === 'true') {
      <button mat-flat-button color="primary" (click)="dismissDialog('browse')">Go to
      Browse</button>
    }
    @if (isCoreSubstance === 'true') {
      <button mat-flat-button color="primary" (click)="dismissDialog('viewInPfda')">View
      Substance</button>
    }
  </div>
}
