<div class="flex-row">
  <span class="middle-fill"></span>
  <!-- <button mat-button (click)="addStructuralModification()">
  Add Modification <mat-icon svgIcon="add_circle_outline"></mat-icon>
</button> -->
</div>
@for (mod of modifications; track mod; let isLast = $last; let index = $index) {
  <div  class = "alternate-backgrounds"  appScrollToTarget [id]="'substance-physical-modification-' + index" >
    <app-physical-modification-form [mod]="mod" (modDeleted)="deletePhysicalModification($event)" ></app-physical-modification-form>
    @if (!isLast) {
      <mat-divider class="form-divider" [inset]="true"></mat-divider>
    }
  </div>
}

@if (modifications && modifications.length > 0) {
  <div class="flex-row">
    <span class = "middle-fill"></span>
    @if (modifications && modifications.length > 0) {
      <button mat-button (click)="addStructuralModification()">
        Add Modification <mat-icon svgIcon="add_circle_outline"></mat-icon>
      </button>
    }
  </div>
}
