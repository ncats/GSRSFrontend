@for (links of otherLinks; track links; let isLast = $last; let index = $index) {
  <div class = "alternate-backgrounds"  appScrollToTarget [id]="'substance-other-links-' + index" >
    <app-other-links-form [link]="links" (linkDeleted)="deleteLink($event)"></app-other-links-form>
    @if (!isLast) {
      <mat-divider class="form-divider" [inset]="true"></mat-divider>
    }
  </div>
}

<div class="flex-row">
  <span class = "middle-fill"></span>
  <button mat-button (click)="addOtherLink()">
    Add link <mat-icon svgIcon="add_circle_outline"></mat-icon>
  </button> </div>
