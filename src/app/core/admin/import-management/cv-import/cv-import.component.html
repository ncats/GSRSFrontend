
<div class = "flex-row">
  <mat-form-field [ngClass] = "privateMod === 'other'?'risen':''" class = "cv-field">

    <mat-select [(ngModel)]="privateMod" name="term" (ngModelChange)="select($event)" [disabled] = "disable">
      <mat-option value = 'other' >Other (New Value)</mat-option>
      @if (privateMod) {
        <mat-option [value] = 'null' ><span class = 'deselect' >Clear selection</span></mat-option>
      }
      @for (term of vocabulary; track term) {
        <mat-option [value]=" term.value">
          {{term.display}}
        </mat-option>
      }
      @if (privateMod && !inCV(  vocabulary, privateMod) && privateMod !== '') {
        <mat-option
        value = "{{privateMod}}">{{privateMod}} ({{domain ? 'not in CV' : 'not in field list'}})</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
@if (privateMod === 'other') {
  <div class = "custom">
    <mat-form-field>
      <input matInput placeholder="Custom value" (focusout) = "updateOrigin($event.target)" name="custom" />
    </mat-form-field>
  </div>
}
