
<div class="responsive">

  <table  mat-table [dataSource]="otherLinks">

    <ng-container matColumnDef="linkageType">
      <th mat-header-cell *matHeaderCellDef> linkageType </th>
      <td mat-cell *matCellDef="let link"> {{link.linkageType}} </td>
    </ng-container>

    <ng-container matColumnDef="residueIndex">
      <th mat-header-cell *matHeaderCellDef> Sites </th>
      <td mat-cell *matCellDef="let link">@if (link.sites) {
        <span>
          @for (site of link.sites; track site) {
            <span>
              {{site.subunitIndex + "_" + site.residueIndex}}
        </span>
          }
        </span>
      }  </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

</div>

<div class="responsive" *ngIf="pairedLinks.length">

  <table  mat-table [dataSource]="pairedLinks">

    <ng-container matColumnDef="linkageType">
      <th mat-header-cell *matHeaderCellDef> linkageType </th>
      <td mat-cell *matCellDef="let pair"> {{pair.linkageType}} </td>
    </ng-container>

    <ng-container matColumnDef="to">
      <th mat-header-cell *matHeaderCellDef> To </th>
      <td mat-cell *matCellDef="let pair"> {{pair.to}} </td>
    </ng-container>

    <ng-container matColumnDef="from">
      <th mat-header-cell *matHeaderCellDef> From </th>
      <td mat-cell *matCellDef="let pair"> {{pair.from}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="pairedDisplayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: pairedDisplayedColumns;"></tr>
  </table>

</div>
