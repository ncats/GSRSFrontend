<div class = "responsive">
  @if (parent) {
    <div class="thumb-col">
      @if (parent.approvalID) {
        <div class = "code">{{parent.approvalID}}</div>
      }
      <img class="image-thumb" appSubstanceImage [entityId]="parent.refuuid">
      <div>
        <a class="substance-name" [routerLink]="['/substances', parent.refuuid]" [innerHTML]="parent.refPname" >
        </a>
      </div>
    </div>
  }
</div>
